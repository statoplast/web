<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statoplast | Naši Projekti</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased">

    <!-- Zaglavlje -->
    <header class="w-full p-6 flex justify-between items-center bg-white/80 backdrop-blur-lg sticky top-0 z-50 border-b border-zinc-200">
        <a href="/" class="text-xs font-bold tracking-[0.2em] text-zinc-500 hover:text-black transition-colors duration-300">← POVRATAK</a>
        <div class="pointer-events-auto cursor-pointer absolute left-1/2 -translate-x-1/2 hidden md:block">
            <img src="logo.png" alt="Statoplast Logo" class="h-6 w-auto object-contain">
        </div>
        <div class="text-sm tracking-widest font-bold hidden md:block">NAŠI <span class="font-light text-zinc-400">PROJEKTI</span></div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-16 md:py-24">
        
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-light tracking-tight mb-4">Uvijek u <span class="font-bold">akciji.</span></h1>
            <p class="text-lg text-zinc-500 font-light max-w-2xl mx-auto">Pratite naše najnovije projekte s terena i iz proizvodnje. Sadržaj se automatski osvježava direktno s našeg službenog Instagram profila.</p>
            <div class="mt-6">
                <a href="https://instagram.com/statoplast" target="_blank" class="inline-flex items-center gap-2 text-sm font-bold tracking-widest hover:text-blue-600 transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clip-rule="evenodd" /></svg>
                    @STATOPLAST
                </a>
            </div>
        </div>

        <!-- INSTAGRAM GRID CONTAINER -->
        <!-- OVDJE IDE KOD ZA AUTOMATIZACIJU. Za sada je JS simulacija, no objasnio sam u skripti dolje kako spojiti pravi API -->
        <div id="instafeed" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Slike će biti generirane putem JS-a ispod -->
        </div>

    </main>

    <script>
        // =================================================================================
        // UPUTA ZA PRAVI INSTAGRAM:
        // Da biste povlačili prave slike, najjednostavnije je kreirati besplatan widget
        // preko stranica kao što su Elfsight.com ili EmbedSocial.com. Oni će vam dati kratku 
        // <script> liniju koda koju samo prekopirate umjesto ovog cijelog <div id="instafeed">
        //
        // Ako želite programerski, potrebno je ovdje ubaciti vaš INSTAGRAM_ACCESS_TOKEN 
        // i pozvati fetch('https://graph.instagram.com/me/media?fields=id,media_type,media_url,permalink&access_token=VAŠ_TOKEN')
        // =================================================================================

        // OVO JE VIZUALNA SIMULACIJA (MOCKUP) DA VIDITE KAKO ĆE TO IZGLEDATI:
        const placeholderImages = [
            "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1558346490-a72e53ae2d4f?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1565514020179-026b92b84bb6?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
            "https://images.unsplash.com/photo-1600573472592-401b489a3cdc?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
        ];

        const feedContainer = document.getElementById('instafeed');
        
        placeholderImages.forEach((url, index) => {
            const delay = index * 100; // animacija učitavanja
            const html = `
                <a href="#" class="group relative aspect-square overflow-hidden rounded-xl bg-zinc-200 block opacity-0 transition-opacity duration-1000" style="animation: fadeIn 0.5s ease forwards ${delay}ms">
                    <img src="${url}" alt="Instagram Projekt" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition-colors duration-300 flex items-center justify-center">
                        <svg class="w-8 h-8 text-white opacity-0 group-hover:opacity-100 transform scale-50 group-hover:scale-100 transition-all duration-300" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63z" clip-rule="evenodd" /></svg>
                    </div>
                </a>
            `;
            feedContainer.insertAdjacentHTML('beforeend', html);
        });
    </script>
    <style>
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</body>
</html>
