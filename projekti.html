<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statoplast | Naši Projekti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased selection:bg-zinc-900 selection:text-white">

    <div class="sticky top-0 z-50 flex flex-col w-full">
        
        <header class="w-full px-6 py-3 md:py-4 flex justify-between items-center bg-white/90 backdrop-blur-md text-zinc-900 border-b border-zinc-200">
            <a href="/" class="pointer-events-auto cursor-pointer z-10 flex items-center gap-4 py-3 pr-4">
                <img src="logo.png" alt="Statoplast Logo" class="h-6 md:h-8 w-auto object-contain brightness-0">      
            </a>        
            
            <nav class="hidden md:flex items-center space-x-2 text-xs font-bold tracking-[0.2em] absolute left-1/2 -translate-x-1/2">      
                <a href="/o-nama" class="text-zinc-500 hover:text-black transition-colors duration-300 py-3 px-3 inline-block">O NAMA</a>        
                <a href="/projekti" class="text-black transition-colors duration-300 py-3 px-3 inline-block">PROJEKTI</a>        
                <a href="/kontakt" class="text-zinc-500 hover:text-black transition-colors duration-300 py-3 px-3 inline-block">KONTAKT</a>   
            </nav>    
            
            <div class="hidden md:flex items-center text-xs font-bold tracking-[0.2em] z-10">      
                <a href="#" class="text-black py-3 px-3 block">HR</a>        
                <div class="h-4 w-[1px] bg-zinc-300 mx-1"></div>        
                <a href="#" class="text-zinc-400 hover:text-black transition-colors py-3 px-3 block">EN</a>   
            </div>
            
            <a href="/" class="md:hidden text-xs font-bold tracking-[0.2em] text-zinc-500 hover:text-black transition-colors duration-300 flex items-center gap-2 z-10 py-3 pl-4">        
                <span>←</span> POVRATAK   
            </a>
        </header>

        <section class="w-full bg-zinc-50/95 backdrop-blur-md border-b border-zinc-200 shadow-sm">
            <div id="secondary-nav" class="max-w-6xl mx-auto px-6 overflow-x-auto whitespace-nowrap scrollbar-none py-4">
                <div class="flex space-x-8 text-sm font-semibold tracking-wide justify-start md:justify-center">
                    <a href="pivot-vrata" class="text-zinc-400 border-b-2 border-transparent hover:text-black transition-all duration-300 pb-1 inline-block">Pivot Vrata</a>
                    <a href="bioklimatske-pergole" class="text-zinc-400 border-b-2 border-transparent hover:text-black transition-all duration-300 pb-1 inline-block">Bioklimatske pergole</a>
                    <a href="alu-stolarija" class="text-zinc-400 border-b-2 border-transparent hover:text-black transition-all duration-300 pb-1 inline-block">Alu Stolarija</a>
                    <a href="moderne-ograde" class="text-zinc-400 border-b-2 border-transparent hover:text-black transition-all duration-300 pb-1 inline-block">Moderne Ograde</a>
                    <a href="zatvaranje-nadstresnica." class="text-zinc-400 border-b-2 border-transparent hover:text-black transition-all duration-300 pb-1 inline-block">Zatvaranje Nadstrešnica</a>
                </div>
            </div>
        </section>
    </div>

    <main class="max-w-7xl mx-auto px-6 py-16 md:py-24">
        
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-light tracking-tight mb-4">Uvijek u <span class="font-bold">akciji.</span></h1>
            <p class="text-lg text-zinc-500 font-light max-w-2xl mx-auto">Pratite naše najnovije projekte s terena i iz proizvodnje. Sadržaj se automatski osvježava direktno s našeg službenog Instagram profila.</p>
            <div class="mt-6">
                <a href="https://instagram.com/statoplast" target="_blank" class="inline-flex items-center gap-2 text-sm font-bold tracking-widest hover:text-blue-600 transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clip-rule="evenodd" /></svg>
                    @STATOPLAST
                </a>
            </div>
        </div>

        <div id="instafeed" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    </main>

    <script>
        const GITHUB_JSON_URL = "https://raw.githubusercontent.com/statoplast/ig-galerija/main/projekti.json";
        const feedContainer = document.getElementById('instafeed');

        feedContainer.innerHTML = '<p class="col-span-full text-center text-zinc-400 py-12 text-sm uppercase tracking-widest animate-pulse">Učitavanje projekata...</p>';

        fetch(GITHUB_JSON_URL)
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                feedContainer.innerHTML = '';
                
                if (!Array.isArray(data)) {
                    throw new Error('Neispravan format podataka.');
                }

                const posts = data.slice(0, 8); 
                
                posts.forEach((post, index) => {
                    const delay = index * 100;
                    const mediaUrl = post.mediaUrl; 
                    const instagramLink = post.permalink;

                    const html = `
                        <a href="${instagramLink}" target="_blank" rel="noopener noreferrer" class="group relative aspect-square overflow-hidden rounded-xl bg-zinc-200 block opacity-0" style="animation: fadeIn 0.6s ease forwards ${delay}ms">
                            <img src="${mediaUrl}" alt="Statoplast Projekt" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
                            
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition-colors duration-300 flex items-center justify-center">
                                <svg class="w-8 h-8 text-white opacity-0 group-hover:opacity-100 transform scale-50 group-hover:scale-100 transition-all duration-300" fill="currentColor" viewBox="0 0 24 24">
                                    <path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clip-rule="evenodd" />
                                </svg>
                            </div>
                        </a>
                    `;
                    feedContainer.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(error => {
                console.error("Greška pri učitavanju Instagram feeda:", error);
                feedContainer.innerHTML = `<p class="col-span-full text-center text-zinc-500 py-12 text-sm">Trenutno nije moguće učitati galeriju. <br> <a href="https://instagram.com/statoplast" target="_blank" class="text-blue-600 hover:underline mt-2 inline-block">Pogledajte direktno na Instagramu</a></p>`;
            });
    </script>
</body>
</html>
